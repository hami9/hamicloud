name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-checks:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: hamicloud
          POSTGRES_PASSWORD: hamicloud_secret
          POSTGRES_DB: hamicloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/api[dev]"

      - name: Run Ruff Lint
        run: |
          ruff check apps/api

      - name: Validate OpenAPI Contract
        run: |
          openapi-spec-validator contracts/openapi/v1.yaml

      - name: Run Alembic Migrations and Schema Check
        env:
          DATABASE_URL_SYNC: postgresql://hamicloud:hamicloud_secret@localhost:5432/hamicloud
        run: |
          alembic -c migrations/alembic.ini upgrade head
          alembic -c migrations/alembic.ini check

      - name: Run Mypy
        run: |
          cd apps/api && mypy --explicit-package-bases app

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://hamicloud:hamicloud_secret@localhost:5432/hamicloud
          DATABASE_URL_SYNC: postgresql://hamicloud:hamicloud_secret@localhost:5432/hamicloud
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest apps/api/tests/ -v

  go-checks:
    name: Go Build & Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go 1.23
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.23"
          cache-dependency-path: runtime/go.sum

      - name: Verify Go format and vet
        run: |
          cd runtime
          test -z "$(gofmt -l .)" || (echo "Unformatted Go files:" && gofmt -l . && exit 1)
          go vet ./...

      - name: Run Go tests with race detector
        run: |
          cd runtime
          go test -v -race ./...

      - name: Build Go binaries
        run: |
          cd runtime
          CGO_ENABLED=0 go build -o ../bin/hamicloud-scheduler ./cmd/hamicloud-scheduler
          CGO_ENABLED=0 go build -o ../bin/hamicloud-executor ./cmd/hamicloud-executor
