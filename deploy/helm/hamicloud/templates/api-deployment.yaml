apiVersion: apps/v1
kind: Deployment
metadata:
  name: hamicloud-api
  namespace: "{{ .Values.global.namespace }}"
  labels:
    app.kubernetes.io/name: hamicloud-api
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/version: "{{ .Chart.AppVersion }}"
    app.kubernetes.io/component: control-plane-api
    app.kubernetes.io/part-of: hamicloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hamicloud-api
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hamicloud-api
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: control-plane-api
    spec:
      serviceAccountName: hamicloud-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}@{{ .Values.api.image.digest }}"
          imagePullPolicy: "{{ .Values.api.image.pullPolicy }}"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hamicloud-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "{{ .Values.api.resources.requests.cpu }}"
              memory: "{{ .Values.api.resources.requests.memory }}"
            limits:
              cpu: "{{ .Values.api.resources.limits.cpu }}"
              memory: "{{ .Values.api.resources.limits.memory }}"
