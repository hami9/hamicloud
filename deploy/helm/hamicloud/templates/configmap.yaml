apiVersion: v1
kind: ConfigMap
metadata:
  name: hamicloud-config
  namespace: "{{ .Values.global.namespace }}"
  labels:
    app.kubernetes.io/name: hamicloud-config
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/part-of: hamicloud
data:
  ENVIRONMENT: "{{ .Values.global.environment }}"
  OIDC_ISSUER_URL: "{{ .Values.config.oidcIssuerUrl }}"
  OIDC_AUDIENCE: "{{ .Values.config.oidcAudience }}"
  POSTGRES_HOST: "{{ .Values.config.postgresHost }}"
  POSTGRES_PORT: "{{ .Values.config.postgresPort }}"
  POSTGRES_DB: "{{ .Values.config.postgresDb }}"
  REDIS_URL: "{{ .Values.config.redisUrl }}"
  NATS_URL: "{{ .Values.config.natsUrl }}"
  S3_ENDPOINT_URL: "{{ .Values.config.s3EndpointUrl }}"
  REGISTRY_ENDPOINT: "{{ .Values.config.registryEndpoint }}"
  WORKLOAD_NAMESPACE_PREFIX: "{{ .Values.config.workloadNamespacePrefix }}"
