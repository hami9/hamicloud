apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Values.secret.existingSecret | default \"hamicloud-secret\" }}"
  namespace: "{{ .Values.global.namespace }}"
  labels:
    app.kubernetes.io/name: hamicloud-secret
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/part-of: hamicloud
type: Opaque
stringData:
  RUNTIME_DATABASE_URL: "{{ .Values.secret.runtimeDatabaseUrl }}"
