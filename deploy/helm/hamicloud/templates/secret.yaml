{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: hamicloud-secret
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: hamicloud-secret
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/part-of: hamicloud
type: Opaque
stringData:
  RUNTIME_DATABASE_URL: {{ required "secret.runtimeDatabaseUrl is required when secret.existingSecret is empty" .Values.secret.runtimeDatabaseUrl | quote }}
{{- end }}
